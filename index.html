<!-- CONTACT -->

<section id="contact">

    <h2
        data-de="Kostenloses Erstgespräch"
        data-en="Free Initial Consultation">
        Kostenloses Erstgespräch
    </h2>

    <div class="contact-grid">

        <!-- LEFT SIDE -->

        <div class="contact-box">

            <p><strong>StratLift Consulting Wiesemann</strong></p>

            <p>
                Commercialstrasse 34<br>
                7000 Chur
            </p>

            <p>
                +41 79 951 21 35
            </p>

            <p>
                <a href="mailto:C.Wiesemann@s-l-c.ch">
                    C.Wiesemann@s-l-c.ch
                </a>
            </p>

            <p>
                <a
                    href="https://www.linkedin.com/company/s-l-con"
                    target="_blank"
                    rel="noopener noreferrer">
                    LinkedIn
                </a>
            </p>

            <br>

            <a
                href="impressum.html"
                data-de="Impressum"
                data-en="Legal Notice">
                Impressum
            </a>

            <br><br>

            <a
                href="datenschutz.html"
                data-de="Datenschutz"
                data-en="Privacy Policy">
                Datenschutz
            </a>

        </div>

        <!-- RIGHT SIDE -->

        <form
            class="consulting-form"
            action="https://formsubmit.co/C.Wiesemann@s-l-c.ch"
            method="POST">

            <input
                type="hidden"
                name="_subject"
                value="Neue Anfrage über s-l-c.ch">

            <input
                type="hidden"
                name="_captcha"
                value="false">

            <input
                type="text"
                name="Name"
                placeholder="Name"
                required>

            <input
                type="email"
                name="E-Mail"
                placeholder="E-Mail"
                required>

            <input
                type="text"
                name="Unternehmen"
                placeholder="Unternehmen">

            <select name="Business Area">

                <option value="">
                    Select Business Area
                </option>

                <option>Strategy</option>
                <option>Business Development</option>
                <option>Market Entry</option>
                <option>Process Optimization</option>
                <option>Digitalization</option>
                <option>Artificial Intelligence</option>
                <option>Other</option>

            </select>

            <label
                data-de="Welchen Geschäftsprozess soll ich analysieren und verbessern?"
                data-en="What business process would you like me to analyze and improve?">
                Welchen Geschäftsprozess soll ich analysieren und verbessern?
            </label>

            <textarea
                name="Process"
                rows="4"></textarea>

            <label
                data-de="Was sind aktuell die grössten Herausforderungen oder Ineffizienzen?"
                data-en="What are the biggest challenges or inefficiencies you are currently facing?">
                Was sind aktuell die grössten Herausforderungen oder Ineffizienzen?
            </label>

            <textarea
                name="Challenges"
                rows="4"></textarea>

            <label
                data-de="Was ist das gewünschte Ergebnis des Projekts?"
                data-en="What is your desired outcome from this project?">
                Was ist das gewünschte Ergebnis des Projekts?
            </label>

            <textarea
                name="Desired Outcome"
                rows="4"></textarea>

            <label
                data-de="Vorhandene Dokumentationen, Prozesse, SOPs oder relevante Informationen"
                data-en="Existing documentation, workflows, SOPs or relevant information">
                Vorhandene Dokumentationen, Prozesse, SOPs oder relevante Informationen
            </label>

            <textarea
                name="Documentation"
                rows="4"></textarea>

            <label
                data-de="Wie viele Mitarbeitende sind am Prozess beteiligt?"
                data-en="How many employees are involved in the process?">
                Wie viele Mitarbeitende sind am Prozess beteiligt?
            </label>

            <textarea
                name="Employees"
                rows="3"></textarea>

            <label
                data-de="Gibt es Rahmenbedingungen oder Anforderungen, die berücksichtigt werden müssen?"
                data-en="Are there any constraints or requirements I should consider?">
                Gibt es Rahmenbedingungen oder Anforderungen, die berücksichtigt werden müssen?
            </label>

            <textarea
                name="Constraints"
                rows="4"></textarea>

            <label
                data-de="Zusätzliche Informationen"
                data-en="Additional Information">
                Zusätzliche Informationen
            </label>

            <textarea
                name="Message"
                rows="5"></textarea>

            <button
                type="submit"
                class="cta"
                data-de="Anfrage senden"
                data-en="Send Request">
                Anfrage senden
            </button>

        </form>

    </div>

</section>
